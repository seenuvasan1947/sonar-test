# ============================================================================
# SonarQube Ephemeral CI/CD Pipeline
# ============================================================================
# This workflow:
#   1. Starts a fresh SonarQube server from Docker
#   2. Generates a random password + changes admin credentials
#   3. Generates a scanner token programmatically
#   4. Runs multi-language code analysis
#   5. Checks Quality Gate status (fails pipeline if failed)
#   6. Cleans up the container
#
# NO secrets required! Everything is ephemeral and auto-generated.
# ============================================================================

name: SonarQube Analysis

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:  # Allow manual trigger

env:
  SONARQUBE_IMAGE: "sonarqube:10.4-community"
  SONARQUBE_CONTAINER: "sonarqube-ephemeral-${{ github.run_id }}"
  SONARQUBE_URL: "http://localhost:9000"
  SONAR_PROJECT_KEY: "multi-lang-project-${{ github.run_id }}"

# Limit to one concurrent run to avoid port/resource conflicts
concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sonarqube-analysis:
    name: SonarQube Multi-Language Analysis
    runs-on: ubuntu-latest

    # Resource constraints (GitHub Actions runners have ~7GB, we limit to ~4GB)
    env:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"  # Critical for Docker-in-Docker

    steps:
      # ========================================================================
      # STEP 1: Checkout Repository
      # ========================================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate Sonar analysis

      # ========================================================================
      # STEP 2: Start SonarQube Container
      # ========================================================================
      - name: Start SonarQube Server
        run: |
          echo "🚀 Starting SonarQube container: ${{ env.SONARQUBE_CONTAINER }}"
          docker run -d \
            --name ${{ env.SONARQUBE_CONTAINER }} \
            --memory=4g \
            --cpus=2.0 \
            -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            ${{ env.SONARQUBE_IMAGE }}

          echo "✅ Container started. Waiting for health check..."

      # ========================================================================
      # STEP 3: Health Check with Retry Logic (120-second timeout)
      # ========================================================================
      - name: Wait for SonarQube to be Ready
        run: |
          echo "⏳ Polling SonarQube health endpoint..."
          MAX_RETRIES=60
          RETRY_INTERVAL=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "  Attempt $RETRY_COUNT/$MAX_RETRIES..."

            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SONARQUBE_URL }}/api/system/status 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              STATUS=$(curl -s ${{ env.SONARQUBE_URL }}/api/system/status | jq -r '.status' 2>/dev/null)
              echo "  SonarQube status: $STATUS"

              if [ "$STATUS" = "UP" ]; then
                echo "✅ SonarQube is UP and ready after $((RETRY_COUNT * RETRY_INTERVAL)) seconds!"
                exit 0
              fi
            fi

            echo "  Not ready yet (HTTP $HTTP_STATUS). Retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done

          echo "❌ SonarQube failed to start within $((MAX_RETRIES * RETRY_INTERVAL)) seconds"
          docker logs ${{ env.SONARQUBE_CONTAINER }} | tail -50
          exit 1

      # ========================================================================
      # STEP 4: Generate Random Password + Change Admin Password
      # ========================================================================
      - name: Generate Random Password
        id: set_password
        run: |
          # Generate a cryptographically random 16-char password (memory only)
          RANDOM_PASSWORD=$(openssl rand -base64 12 | tr -dc 'a-zA-Z0-9' | head -c 16)
          echo "password=$RANDOM_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "🔐 Random password generated (16 chars, alphanumeric)"

      - name: Change Admin Password
        run: |
          echo "🔐 Changing admin password from default 'admin'..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u admin:admin \
            -X POST "${{ env.SONARQUBE_URL }}/api/users/change_password?login=admin&previousPassword=admin&password=${{ steps.set_password.outputs.password }}" \
            2>/dev/null)

          if [ "$HTTP_STATUS" = "204" ]; then
            echo "✅ Admin password changed successfully"
          else
            echo "❌ Failed to change admin password (HTTP $HTTP_STATUS)"
            echo "Possible causes:"
            echo "  - SonarQube not fully initialized"
            echo "  - Default credentials already changed (should not happen on fresh container)"
            exit 1
          fi

      # ========================================================================
      # STEP 5: Generate Scanner Token (stored in memory only)
      # ========================================================================
      - name: Generate Scanner Token
        id: generate_token
        run: |
          echo "🔑 Generating scanner token..."

          TOKEN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -u admin:${{ steps.set_password.outputs.password }} \
            "${{ env.SONARQUBE_URL }}/api/user_tokens/generate" \
            --data-urlencode "name=scanner-token-${{ github.run_id }}")

          HTTP_CODE=$(echo "$TOKEN_RESPONSE" | tail -1)
          BODY=$(echo "$TOKEN_RESPONSE" | sed '$d')

          echo "  HTTP status: $HTTP_CODE"
          echo "  Response: $BODY"

          # Extract token from response (stored in memory via GITHUB_OUTPUT)
          SCANNER_TOKEN=$(echo "$BODY" | jq -r '.token // empty')

          if [ -z "$SCANNER_TOKEN" ] || [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Failed to generate scanner token"
            echo "Response: $BODY"
            exit 1
          fi

          # Store in GITHUB_OUTPUT (memory-only, never persisted to disk)
          echo "token=$SCANNER_TOKEN" >> "$GITHUB_OUTPUT"
          echo "✅ Scanner token generated successfully"

      # ========================================================================
      # STEP 6: Run SonarQube Scanner Analysis
      # ========================================================================
      - name: SonarQube Scanner
        run: |
          echo "🔍 Starting SonarQube analysis..."

          # Create sonar-project.properties dynamically for multi-language support
          cat > sonar-project.properties << EOF
          sonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
          sonar.projectName=Multi-Language Project
          sonar.sources=.
          sonar.host.url=${{ env.SONARQUBE_URL }}
          sonar.token=${{ steps.generate_token.outputs.token }}
          sonar.qualitygate.wait=true
          sonar.verbose=true

          # Multi-language inclusions
          sonar.inclusions=**/*.java,**/*.js,**/*.ts,**/*.jsx,**/*.tsx,**/*.py,**/*.cs,**/*.html,**/*.css,**/*.json,**/*.xml,**/*.sql,**/*.sh,**/*.yml,**/*.yaml,**/*.md

          # Language-specific settings
          sonar.java.source=17
          sonar.javascript.lcov.reportPaths=coverage/lcov.info
          sonar.python.coverage.reportPaths=coverage/coverage.xml
          sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

          # Exclusions
          sonar.exclusions=**/node_modules/**,**/vendor/**,**/.git/**,**/target/**,**/bin/**,**/obj/**,**/dist/**,**/build/**,**/*.min.js,**/*.min.css,**/__pycache__/**,**/*.pyc
          EOF

          echo "📋 SonarQube configuration:"
          cat sonar-project.properties

          # Run SonarScanner via Docker
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:/usr/src" \
            -e SONAR_HOST_URL="${{ env.SONARQUBE_URL }}" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey="${{ env.SONAR_PROJECT_KEY }}" \
            -Dsonar.sources="." \
            -Dsonar.host.url="${{ env.SONARQUBE_URL }}" \
            -Dsonar.token="${{ steps.generate_token.outputs.token }}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.verbose=true \
            -Dsonar.inclusions="**/*.java,**/*.js,**/*.ts,**/*.jsx,**/*.tsx,**/*.py,**/*.cs,**/*.html,**/*.css,**/*.json,**/*.xml,**/*.sql,**/*.sh,**/*.yml,**/*.yaml,**/*.md" \
            -Dsonar.java.source=17 \
            -Dsonar.exclusions="**/node_modules/**,**/vendor/**,**/.git/**,**/target/**,**/bin/**,**/obj/**,**/dist/**,**/build/**,**/*.min.js,**/*.min.css,**/__pycache__/**,**/*.pyc"

          echo "✅ SonarQube analysis completed"

      # ========================================================================
      # STEP 7: Wait for Background Analysis & Check Quality Gate
      # ========================================================================
      - name: Wait for Analysis Processing
        run: |
          echo "⏳ Waiting for SonarQube to finish background processing..."

          MAX_RETRIES=60
          RETRY_INTERVAL=5
          RETRY_COUNT=0
          TASK_ID=""

          # Get the most recent task ID for this project
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))

            TASK_RESPONSE=$(curl -s \
              -u admin:${{ steps.set_password.outputs.password }} \
              "${{ env.SONARQUBE_URL }}/api/ce/component?component=${{ env.SONAR_PROJECT_KEY }}" 2>/dev/null)

            TASK_ID=$(echo "$TASK_RESPONSE" | jq -r '.current.id // empty')
            TASK_STATUS=$(echo "$TASK_RESPONSE" | jq -r '.current.status // "PENDING"')

            echo "  Task ID: $TASK_ID | Status: $TASK_STATUS"

            if [ "$TASK_STATUS" = "SUCCESS" ] || [ "$TASK_STATUS" = "FAILED" ] || [ "$TASK_STATUS" = "CANCELED" ]; then
              echo "✅ Task completed with status: $TASK_STATUS"
              break
            fi

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "⚠️ Task still processing after $((RETRY_COUNT * RETRY_INTERVAL))s. Proceeding to Quality Gate check..."
            else
              echo "  Still processing... retrying in ${RETRY_INTERVAL}s"
              sleep $RETRY_INTERVAL
            fi
          done

      - name: Check Quality Gate Status
        run: |
          echo "🚦 Checking Quality Gate status..."

          MAX_RETRIES=30
          RETRY_INTERVAL=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))

            QG_RESPONSE=$(curl -s \
              -u admin:${{ steps.set_password.outputs.password }} \
              "${{ env.SONARQUBE_URL }}/api/qualitygates/project_status?projectKey=${{ env.SONAR_PROJECT_KEY }}" 2>/dev/null)

            QG_STATUS=$(echo "$QG_RESPONSE" | jq -r '.projectStatus.status // "UNKNOWN"')

            echo "  Quality Gate status: $QG_STATUS (attempt $RETRY_COUNT/$MAX_RETRIES)"

            if [ "$QG_STATUS" = "OK" ]; then
              echo "✅ Quality Gate PASSED!"
              exit 0
            elif [ "$QG_STATUS" = "ERROR" ]; then
              echo "❌ Quality Gate FAILED!"
              echo ""
              echo "📊 Failure details:"
              echo "$QG_RESPONSE" | jq -r '.projectStatus.conditions[] | select(.status != "OK") | "  - \(.metricName): \(.actualValue) (threshold: \(.errorThreshold))"'
              exit 1
            fi

            echo "  Still waiting... retrying in ${RETRY_INTERVAL}s"
            sleep $RETRY_INTERVAL
          done

          echo "❌ Quality Gate check timed out"
          exit 1

      # ========================================================================
      # STEP 8: Fetch All Findings & Generate Report Artifact
      # ========================================================================
      - name: Fetch All Findings
        id: fetch_all
        run: |
          echo "📥 Fetching all findings from SonarQube..."

          AUTH="admin:${{ steps.set_password.outputs.password }}"
          BASE_URL="${{ env.SONARQUBE_URL }}"
          PK="${{ env.SONAR_PROJECT_KEY }}"

          # Fetch security hotspots
          echo "  Fetching hotspots..."
          HOTSPOTS=$(curl -s -u "$AUTH" "$BASE_URL/api/hotspots/search?projectKey=$PK&ps=500" 2>/dev/null)

          # Fetch vulnerabilities
          echo "  Fetching vulnerabilities..."
          VULNS=$(curl -s -u "$AUTH" "$BASE_URL/api/issues/search?componentKeys=$PK&types=VULNERABILITY&ps=500" 2>/dev/null)

          # Fetch code smells
          echo "  Fetching code smells..."
          SMELLS=$(curl -s -u "$AUTH" "$BASE_URL/api/issues/search?componentKeys=$PK&types=CODE_SMELL&ps=500" 2>/dev/null)

          # Fetch bugs
          echo "  Fetching bugs..."
          BUGS_JSON=$(curl -s -u "$AUTH" "$BASE_URL/api/issues/search?componentKeys=$PK&types=BUG&ps=500" 2>/dev/null)

          # Fetch security bugs (same as vulnerabilities but via issues API)
          echo "  Fetching security bugs..."
          SEC_BUGS=$(curl -s -u "$AUTH" "$BASE_URL/api/issues/search?componentKeys=$PK&types=VULNERABILITY&ps=500" 2>/dev/null)

          # Save full responses to temp files for artifact
          mkdir -p /tmp/sonar-report
          echo "$HOTSPOTS" > /tmp/sonar-report/hotspots.json
          echo "$VULNS" > /tmp/sonar-report/vulnerabilities.json
          echo "$SMELLS" > /tmp/sonar-report/code_smells.json
          echo "$BUGS_JSON" > /tmp/sonar-report/bugs.json

          # Extract counts
          HOTSPOT_COUNT=$(echo "$HOTSPOTS" | jq -r '.paging.total // 0')
          VULN_COUNT=$(echo "$VULNS" | jq -r '.paging.total // 0')
          SMELL_COUNT=$(echo "$SMELLS" | jq -r '.paging.total // 0')
          BUG_COUNT=$(echo "$BUGS_JSON" | jq -r '.paging.total // 0')

          echo "hotspot_count=$HOTSPOT_COUNT" >> "$GITHUB_OUTPUT"
          echo "vuln_count=$VULN_COUNT" >> "$GITHUB_OUTPUT"
          echo "smell_count=$SMELL_COUNT" >> "$GITHUB_OUTPUT"
          echo "bug_count=$BUG_COUNT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "📊 Summary:"
          echo "  🔴 Vulnerabilities: $VULN_COUNT"
          echo "  🟡 Security hotspots: $HOTSPOT_COUNT"
          echo "  🐛 Bugs: $BUG_COUNT"
          echo "  🧹 Code smells: $SMELL_COUNT"

      - name: Generate Security Report
        run: |
          echo "📝 Generating security report..."

          jq -n \
            --arg project "${{ env.SONAR_PROJECT_KEY }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sonar_url "${{ env.SONARQUBE_URL }}" \
            --slurpfile hotspots /tmp/sonar-report/hotspots.json \
            --slurpfile vulns /tmp/sonar-report/vulnerabilities.json \
            --slurpfile smells /tmp/sonar-report/code_smells.json \
            --slurpfile bugs /tmp/sonar-report/bugs.json \
            '{
              report_metadata: {
                project_key: $project,
                github_run_id: $run_id,
                repository: $repo,
                branch: $branch,
                commit_sha: $commit,
                generated_at: $timestamp,
                sonarqube_url: $sonar_url
              },
              summary: {
                security_hotspots: ($hotspots[0].paging.total // 0),
                vulnerabilities: ($vulns[0].paging.total // 0),
                bugs: ($bugs[0].paging.total // 0),
                code_smells: ($smells[0].paging.total // 0)
              },
              security_hotspots: $hotspots[0],
              vulnerabilities: $vulns[0],
              bugs: $bugs[0],
              code_smells: $smells[0]
            }' > /tmp/sonar-report/security-report.json

          echo "✅ Report generated at /tmp/sonar-report/security-report.json"

      - name: Upload Security Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-security-report-${{ github.run_id }}
          path: /tmp/sonar-report/security-report.json
          retention-days: 30

      - name: Fetch Security Bugs
        id: security_bugs
        run: |
          echo "🐛 Fetching security bugs (vulnerabilities)..."

          BUGS_RESPONSE=$(curl -s \
            -u admin:${{ steps.set_password.outputs.password }} \
            "${{ env.SONARQUBE_URL }}/api/issues/search?componentKeys=${{ env.SONAR_PROJECT_KEY }}&types=VULNERABILITY&ps=100" 2>/dev/null)

          TOTAL_BUGS=$(echo "$BUGS_RESPONSE" | jq -r '.paging.total // 0')
          echo "total=$TOTAL_BUGS" >> "$GITHUB_OUTPUT"

          echo "  Total security bugs (vulnerabilities): $TOTAL_BUGS"

          if [ "$TOTAL_BUGS" -gt 0 ]; then
            echo ""
            echo "📊 Security Bug Details:"
            echo "$BUGS_RESPONSE" | jq -r '.issues[] | "  - [\(.component)] \(.rule): \(.message)"' 2>/dev/null || echo "  (details unavailable)"
          fi

      - name: Fetch Code Smells
        id: code_smells
        run: |
          echo "🧹 Fetching code smells..."

          SMELLS_RESPONSE=$(curl -s \
            -u admin:${{ steps.set_password.outputs.password }} \
            "${{ env.SONARQUBE_URL }}/api/issues/search?componentKeys=${{ env.SONAR_PROJECT_KEY }}&types=CODE_SMELL&ps=100" 2>/dev/null)

          TOTAL_SMELLS=$(echo "$SMELLS_RESPONSE" | jq -r '.paging.total // 0')
          echo "total=$TOTAL_SMELLS" >> "$GITHUB_OUTPUT"

          echo "  Total code smells: $TOTAL_SMELLS"

          if [ "$TOTAL_SMELLS" -gt 0 ]; then
            echo ""
            echo "📊 Top Code Smells:"
            echo "$SMELLS_RESPONSE" | jq -r '.issues[:10] | .[] | "  - [\(.severity)] \(.component): \(.message)"' 2>/dev/null || echo "  (details unavailable)"
          fi

      - name: Fetch Bugs
        id: bugs
        run: |
          echo "🐛 Fetching bugs..."

          BUGS_RESPONSE=$(curl -s \
            -u admin:${{ steps.set_password.outputs.password }} \
            "${{ env.SONARQUBE_URL }}/api/issues/search?componentKeys=${{ env.SONAR_PROJECT_KEY }}&types=BUG&ps=100" 2>/dev/null)

          TOTAL_BUGS=$(echo "$BUGS_RESPONSE" | jq -r '.paging.total // 0')
          echo "total=$TOTAL_BUGS" >> "$GITHUB_OUTPUT"

          echo "  Total bugs: $TOTAL_BUGS"

          if [ "$TOTAL_BUGS" -gt 0 ]; then
            echo ""
            echo "📊 Bug Details:"
            echo "$BUGS_RESPONSE" | jq -r '.issues[] | "  - [\(.severity)] \(.component): \(.message)"' 2>/dev/null || echo "  (details unavailable)"
          fi

      - name: Fail if Security Issues Found
        run: |
          echo "🚨 Evaluating security findings..."

          HOTSPOTS=${{ steps.fetch_all.outputs.hotspot_count }}
          VULNS=${{ steps.fetch_all.outputs.vuln_count }}
          CODE_SMELLS=${{ steps.fetch_all.outputs.smell_count }}
          BUGS=${{ steps.fetch_all.outputs.bug_count }}

          echo ""
          echo "📊 Summary:"
          echo "  🔴 Security vulnerabilities: $VULNS"
          echo "  🟡 Security hotspots: $HOTSPOTS"
          echo "  🐛 Bugs: $BUGS"
          echo "  🧹 Code smells: $CODE_SMELLS"
          echo ""

          FAILED=false

          if [ "$VULNS" -gt 0 ]; then
            echo "❌ FAIL: $VULNS security vulnerability(ies) found!"
            FAILED=true
          fi

          if [ "$HOTSPOTS" -gt 0 ]; then
            echo "❌ FAIL: $HOTSPOTS security hotspot(s) found!"
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo ""
            echo "💡 Pipeline failed due to security issues."
            echo "    Review the details above or download the security report artifact."
            exit 1
          else
            echo "✅ No critical security issues found."
            if [ "$CODE_SMELLS" -gt 0 ]; then
              echo "  ⚠️ $CODE_SMELLS code smell(s) detected (warning only, not failing)."
            fi
            if [ "$BUGS" -gt 0 ]; then
              echo "  ⚠️ $BUGS bug(s) detected (warning only, not failing)."
            fi
          fi

      # ========================================================================
      # STEP 8: Cleanup (Always runs, even on failure)
      # ========================================================================
      - name: Cleanup SonarQube Container
        if: always()
        run: |
          echo "🧹 Cleaning up SonarQube container..."

          # Stop and remove the container
          docker stop ${{ env.SONARQUBE_CONTAINER }} 2>/dev/null || echo "Container already stopped"
          docker rm ${{ env.SONARQUBE_CONTAINER }} 2>/dev/null || echo "Container already removed"

          # Remove any dangling volumes
          docker volume prune -f 2>/dev/null || true

          echo "✅ Cleanup complete"
          echo "📊 Container logs (last 100 lines):"
          docker logs ${{ env.SONARQUBE_CONTAINER }} 2>&1 | tail -100 || echo "Logs unavailable"
